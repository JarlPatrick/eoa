name: eoa

services:
  mariadb:
    image: mariadb:10.11.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eoa
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: eoamanager
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backups/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: eoa
      DB_USERNAME: eoamanager
      DB_PASSWORD: ${MYSQL_PASSWORD}
      EOA_INTERNAL_API_TOKEN: ${PUBLIC_ID_SECRET}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health', headers={'X-EOA-Internal-Token': os.environ['EOA_INTERNAL_API_TOKEN']}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      EOA_INTERNAL_API_TOKEN: ${PUBLIC_ID_SECRET}
      PUBLIC_ID_SECRET: ${PUBLIC_ID_SECRET}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-8080}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mariadb_data:
